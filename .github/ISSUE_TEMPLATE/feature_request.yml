name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas, consider starting a thread in Discussions → Ideas first.
        Concrete, scoped requests work best as issues.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work. Mock-ups and examples are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Pipeline / hiring
        - Candidates / talent database
        - Applicant portal / careers
        - Assessments
        - Interviews / calendar
        - Email notifications
        - AI features
        - Authentication / MFA / roles
        - Self-hosting / operations
        - Other
    validations:
      required: true

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to contribute this?
      options:
        - "Yes, I can open a pull request"
        - "Maybe, with guidance"
        - "No"

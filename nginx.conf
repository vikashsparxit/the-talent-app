# Cache policy by path. The service worker, its registration script, the web
# manifest and every HTML route must revalidate on each load so a deploy is
# picked up straight away; hashed build assets never change and can be cached.
map $uri $app_cache_control {
    ~^/assets/                                          "public, max-age=31536000, immutable";
    ~*^/(sw\.js|registerSW\.js|manifest\.webmanifest)$  "no-cache";
    ~*\.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webmanifest)$ "public, max-age=604800";
    default                                             "no-cache";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # TLS terminates at the proxy in front of this container; browsers only
    # honour HSTS on HTTPS responses, so it is harmless on plain HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # microphone is allowed for our own origin only, for voice search.
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    # Report-Only first: violations are logged to the browser console without
    # blocking anything, so the policy can be verified against real usage
    # before it is switched to Content-Security-Policy.
    # connect-src, img-src and frame-src allow any https: origin because the
    # Supabase API origin (REST, auth, storage, realtime, signed resume/PDF
    # URLs) differs per deployment. When enforcing, replace https:/wss: with
    # your Supabase origin, e.g. https://supabase.example.com wss://supabase.example.com.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src 'self' blob: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    add_header Cache-Control $app_cache_control always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
